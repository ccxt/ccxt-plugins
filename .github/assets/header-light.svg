<style>
  .c { transform-box: fill-box; transform-origin: center bottom; animation: grow 9.0s ease-out infinite both; }
  @keyframes grow { 0% { opacity: 0; transform: scaleY(0.2); } 4% { opacity: 1; transform: scaleY(1); } 88% { opacity: 1; transform: scaleY(1); } 96%,100% { opacity: 0; transform: scaleY(1); } }
  .dot { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
  .tape { animation: scroll 40s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .fade { animation: in .8s ease-out both; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .c, .dot, .tape, .fade { animation: none; } }
</style>
